[project]
name = "steam-tldr"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "streamlit>=1.66.1",
]

[dependency-groups]
dev = [
    "huggingface-hub>=2.4.0",
    "marimo>=0.25.2",
]
transformer = [
    "torch>=2.15.0",
    "transformers>=5.22.0",
]
